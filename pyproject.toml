[project]
name = "hybridai-h1"
version = "0.1.0"
description = "Hybrid AI H1 session — tooling built on the FrameX frame-logic engine"
readme = "README.md"
requires-python = ">=3.10"
# The FrameX Python package is only a client; reasoning happens in the `framex`
# Rust engine, built from the same commit by scripts/install-engine.sh.
dependencies = [
    "framex",
    "gradio>=6.31.0",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
# Keep this rev in step with the engine: scripts/install-engine.sh reads it.
framex = { git = "https://gitlab.com/ds-unisg/framex-core", subdirectory = "python", rev = "977bb14db288caeb6bf1b253fdb8e25f83ada711" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Application packages live under src/; hatchling strips that prefix.
packages = ["src/cli", "src/data", "src/ontology", "src/runtime", "src/pipeline", "src/ui"]

[tool.ruff.lint.per-file-ignores]
# Tests import pytest fixtures (e.g. `client`) from test_regression; using them as
# parameters is not a redefinition bug.
"tests/*" = ["F811"]
